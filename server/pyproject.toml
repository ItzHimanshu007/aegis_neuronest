[project]
name = "aegis-server"
version = "0.1.0"
description = "Aegis server — FastAPI + open-weight VLM adapter behind an OpenAI-compatible API. Sees only tokens and redacted pixels."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.9",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "respx>=0.23.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends(...) in a default argument is the framework's documented pattern, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
