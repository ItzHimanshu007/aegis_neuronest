<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Aegis Demo &mdash; Framed fields</title>
    <style>
      body { margin: 0; padding: 12px; font-family: sans-serif; font-size: 13px; }
      label { display: block; font-weight: 600; margin-bottom: 4px; }
      input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; width: 90%; margin-bottom: 10px; }
    </style>
  </head>
  <body>
    <label for="framed-full-name">Framed full name</label>
    <input id="framed-full-name" name="framed-full-name" type="text" />

    <label for="framed-email">Framed email address</label>
    <input id="framed-email" name="framed-email" type="email" />
  </body>
</html>
