<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Aegis Demo &mdash; Framed form</title>
    <style>
      body { margin: 0; padding: 12px; font-family: sans-serif; font-size: 13px; }
      label { display: block; font-weight: 600; margin-bottom: 4px; }
      input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; width: 90%; }
    </style>
  </head>
  <body>
    <label for="framed-name">Framed name</label>
    <input id="framed-name" type="text" value="Rohit Kumar" />
  </body>
</html>
