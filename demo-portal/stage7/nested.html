<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stage 7 &mdash; deeply nested markup</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      section { border: 1px solid #ddd; border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; }
      h2 { margin-top: 0; font-size: 15px; }
      .kv { display: grid; grid-template-columns: 220px 1fr; gap: 6px 12px; font-size: 13px; }
      .kv dt { font-weight: 600; } .kv dd { margin: 0; }
      table { border-collapse: collapse; font-size: 13px; }
      th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
      label { display: block; font-size: 13px; margin: 8px 0 2px; }
      input { font-size: 13px; padding: 4px 6px; width: 260px; }
      p, li { font-size: 13px; }
      iframe { width: 340px; height: 120px; border: 1px solid #ccc; }
    </style>
  </head>
  <body>
    <header>
      <p class="badge">STAGE 7 FIXTURE &mdash; SYNTHETIC DATA. Every value is fabricated.</p>
    </header>
    <main class="page">
      <h1>Stage 7 &mdash; deeply nested markup</h1>
      <p><a href="/index.html">&larr; back</a> &middot; see <code>demo-portal/stage7/README.md</code> for the labelling rule.</p>

      <section>
        <h2>Account summary</h2>
        <div><div><div><div><div><div>
          <p>Thank you for your request. Our records currently show <em><strong><span data-gt="BANK_ACCOUNT" data-gt-label="none" data-gt-construct="nested">5853936029031980</span></strong></em>.</p>
          <div><div><span data-gt="FINANCIAL_VALUE" data-gt-label="none" data-gt-construct="nested">&#8377;9,503.00</span></div></div>
        </div></div></div></div></div></div>
      </section>
    </main>
  </body>
</html>
